name: build_size
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  report-size:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install
        run: yarn && cd site && yarn && cd ..

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 14

      - name: report-compressed-size
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # v2
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          build-script: 'prepublishOnly'
          pattern: './{dist,es,lib,icon}/**/*.{js,css}'
          clean-script: 'dependencies'

      - name: build:cjs
        run: yarn run build:cjs
