  #     - name: install
  #       run: yarn run dependencies

  #     - name: setup node
  #       uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
  #       with:
  #         node-version: 16
  #         cache: 'yarn'

  #     - name: run-icon
  #       run: yarn icon

  #     - name: mock-time
  #       uses: szenius/set-timezone@dd47655c84241eec2ffa0a855959c16c0920c3c4 # v1.0
  #       with:
  #         timezoneLinux: 'Asia/Singapore'
