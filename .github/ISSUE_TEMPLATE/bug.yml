name: Component or package regression
description: Report a rendering, accessibility, compatibility or installation issue.
body:
  - type: input
    id: versions
    attributes:
      label: Arco release, React version, browser and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction, expected and observed behavior
      description: For installation or upgrade failures, include the asset name and package manager. Remove credentials and private URLs.
    validations:
      required: true
